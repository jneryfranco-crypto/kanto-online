name: Validate FireRed map engine

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "README_MAPA.md"
      - "setup-map.sh"
      - "setup-map.ps1"
      - "extract-map.sh"
      - ".github/workflows/validate-world.yml"
      - "engine"
      - "decomp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Link the pinned FireRed decompilation
        run: ln -s ../decomp engine/decomp

      - name: Install dependencies
        working-directory: engine
        run: |
          npm ci
          python -m pip install -r scripts/requirements.txt

      - name: Extract maps and run all validators in dependency order
        run: bash ./extract-map.sh

      - name: Type-check and production build
        working-directory: engine
        run: |
          npm run typecheck
          npm run build

      - name: Install Chromium for visual smoke test
        working-directory: engine
        run: npx playwright install --with-deps chromium

      - name: Launch game and capture key Kanto locations
        working-directory: engine
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/kanto-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/
          KANTO_URL=http://127.0.0.1:3000 node scripts/tests/browser_test.mjs test-rendering

      - name: Upload generated map and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fire-red-validation
          path: |
            engine/public/
            engine/dist/
            engine/tmp/screenshots/
            /tmp/kanto-vite.log
          if-no-files-found: warn
          retention-days: 7
