name: Validate FireRed map engine

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "README_MAPA.md"
      - "setup-map.sh"
      - "setup-map.ps1"
      - ".github/workflows/validate-world.yml"
      - "engine"
      - "decomp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Link the pinned FireRed decompilation
        run: ln -s ../decomp engine/decomp

      - name: Install dependencies
        working-directory: engine
        run: |
          npm ci
          python -m pip install -r scripts/requirements.txt

      - name: Extract map data from FireRed source
        working-directory: engine
        run: npm run extract

      - name: Validate extraction, map stitching, traversal and warps
        working-directory: engine
        run: npm test

      - name: Type-check and production build
        working-directory: engine
        run: |
          npm run typecheck
          npm run build
